
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff7fa">
  <title>나의 컬렉션 | GACHA MEMO</title>
  <link rel="stylesheet" href="collection.css">
  <script src="collection.js" defer></script>
</head>

<body>

  <!-- 상단 -->
  <header class="site-header">
    <a class="brand" href="../index.html">
      GACHA MEMO
    </a>

    <a class="home-link" href="../index.html">
      <span aria-hidden="true">←</span>
      홈으로
    </a>
  </header>

  <main class="page">

    <!-- 페이지 소개 -->
    <section class="intro">
      <p class="eyebrow">MY LITTLE COLLECTION</p>
      <h1>나의 컬렉션</h1>
      <p class="intro-text">
        마음에 드는 기억들을 하나씩 모아 보세요.<br>
        소중한 순간들이 나만의 작은 진열장을 채워요.
      </p>
    </section>

    <!-- 컬렉션 통계 -->
    <section class="summary" aria-label="컬렉션 정보">
      <div class="summary-card">
        <span class="summary-number" id="favorite-count">0</span>
        <span class="summary-label">모아 둔 캡슐</span>
      </div>

      <div class="summary-card">
        <span class="summary-number" id="total-count">0</span>
        <span class="summary-label">전체 기록</span>
      </div>
    </section>

    <!-- 정렬 -->
    <section class="collection-section">
      <div class="section-heading">
        <div>
          <h2>나의 캡슐 진열장</h2>
        </div>

        <label class="sort-control">
          <span class="sr-only">정렬 방식</span>
          <select id="sort-select">
            <option value="new">최근 저장순</option>
            <option value="old">오래된 순</option>
          </select>
        </label>
      </div>

      <!-- 빈 컬렉션 -->
      <div class="empty-state" id="empty-state" hidden>
        <div class="empty-capsule" aria-hidden="true">
          <span>♡</span>
        </div>

        <h3>아직 모아 둔 기억이 없어요.</h3>
        <p>
          마음에 드는 기억에 하트를 눌러<br>
          나만의 컬렉션을 만들어 보세요!
        </p>

        <a href="../index.html" class="pink-button">
          캡슐 뽑으러 가기
        </a>
      </div>

      <!-- 캡슐 진열장 -->
      <div class="shelf" id="collection-shelf" hidden>
        <div class="capsule-grid" id="capsule-grid"></div>
      </div>

      <p class="shelf-caption" id="shelf-caption" hidden>
        캡슐을 누르면 소중한 기억을 다시 볼 수 있어요.
      </p>
    </section>

  </main>

  <!-- 기억 상세 팝업 -->
  <div class="modal" id="memory-modal" hidden>

    <div class="modal-backdrop" data-close-modal></div>

    <section
      class="modal-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="detail-title"
      tabindex="-1"
    >

      <button
        class="modal-close"
        type="button"
        data-close-modal
        aria-label="닫기"
      >×</button>

      <div class="memory-ticket">

        <div class="ticket-top">
          <span class="ticket-label">MY MEMORY TICKET</span>

          <button
            id="detail-favorite"
            class="favorite-button is-favorite"
            type="button"
            aria-label="컬렉션에서 제외"
            aria-pressed="true"
            title="컬렉션에서 제외"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>
            </svg>
          </button>
        </div>

        <p class="ticket-date" id="detail-date"></p>
        <h2 class="ticket-title" id="detail-title"></h2>

        <div class="ticket-mood" id="detail-mood"></div>

        <div class="ticket-line"></div>

        <p class="ticket-content" id="detail-content"></p>

        <p
          class="ticket-message"
          id="detail-message"
          role="status"
          aria-live="polite"
        ></p>

      </div>

      <button
        type="button"
        class="pink-button close-bottom"
        data-close-modal
      >
        닫기
      </button>

    </section>
  </div>

</body>
</html>
